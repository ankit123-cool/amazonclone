services:
  # 1. Backend Server
  - type: web
    name: amazon-backend-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_VERSION
        value: 16

  # 2. Frontend Website 
  - type: web
    name: amazon-frontend-web
    runtime: static
    plan: free
    repo: https://github.com
    publishDirectory: client/build
    buildCommand: cd client && npm install && npm run build


